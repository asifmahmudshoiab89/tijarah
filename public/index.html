<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tijarah</title><style>body{margin:0;background:#f5f5f7;color:#161616;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px}.brand{font-size:30px;font-weight:800}.sub{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}.card{background:white;border:1px solid #e6e6e8;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0000000a}.btn{padding:11px 15px;border:0;border-radius:12px;background:#173b31;color:white;cursor:pointer}.input{padding:11px;border:1px solid #ddd;border-radius:11px;width:100%;box-sizing:border-box;margin:5px 0}</style><div class="wrap"><div class="brand">Tijarah</div><div class="sub">Premium Business OS</div><div class="grid"><div class="card"><h2>Dashboard</h2><p>আপনার ব্যবসার data এক জায়গায়।</p><button class="btn" onclick="load()">Refresh</button></div><div class="card"><h2>Digital Service</h2><input id="c" class="input" type="number" value="1600"><input id="p" class="input" type="number" value="1900"><button class="btn" onclick="calc()">Profit Calculate</button><p id="out">Profit: ৳300</p></div><div class="card"><h2>Products</h2><div id="products">Loading...</div></div><div class="card"><h2>Tijarah AI</h2><p>AI integration point প্রস্তুত। Production AI provider এখানে যুক্ত হবে।</p></div></div></div><script>async function load(){let r=await fetch('/api/products');let d=await r.json();products.innerHTML=d.length?d.map(x=>`<p><b>${x.name}</b><br>Stock: ${x.stock} · Sell: ৳${x.price}</p>`).join(''):'No products yet'}function calc(){let x=+c.value,y=+p.value;out.textContent='Profit: ৳'+(y-x).toFixed(2)+' · Margin: '+((y-x)/y*100).toFixed(2)+'%'}load()</script></html>
